<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Casino Tracker</title>
<script src="sb-client.bundle.js?v=1"></script>
<script src="discord-embedded-app-sdk.js?v=1"></script>
<style>
  :root{
    color-scheme:dark;
    --bg:#0d1411; --panel:#151f1a; --panel2:#1b2721; --border:#28362e;
    --text:#e9f1ec; --muted:rgba(233,241,236,.58); --faint:rgba(233,241,236,.32);
    --gold:#e7c15c; --gold-dim:#b9973f;
    --win:#48d78d; --loss:#ff6f6f; --chip:#22302a;
    --shadow:0 8px 30px rgba(0,0,0,.45);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --top-inset:0px;
  }
  /* Inside Discord on a phone, Discord overlays an app-name dropdown + Leave button
     at the very top of the Activity. Push our content below it. Desktop Discord puts
     that chrome outside the iframe, so only inset on narrow (mobile) viewports. */
  @media (max-width:768px){
    body.in-discord{--top-inset:calc(env(safe-area-inset-top,0px) + 52px);}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:
    radial-gradient(1200px 600px at 50% -10%,#16241d 0%,var(--bg) 60%) fixed;
    color:var(--text);min-height:100vh;}
  #auth-status{display:none;padding:calc(60px + var(--top-inset)) 24px 60px;text-align:center;font-size:14px;color:var(--muted);}
  #auth-status.show{display:block;}
  #auth-debug{font-size:11px;color:var(--faint);margin-top:10px;word-break:break-word;font-family:monospace;}
  #app{display:none;max-width:520px;margin:0 auto;padding:var(--top-inset) 14px calc(88px + var(--safe-bottom));}
  #app.show{display:block;}
  .screen{display:none;padding-top:14px;}
  .screen.show{display:block;}
  h1,h2,h3{margin:0;}
  .section-label{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:20px 2px 8px;}
  .muted{color:var(--muted);} .faint{color:var(--faint);}
  .win{color:var(--win);} .loss{color:var(--loss);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow);}

  /* ── Day header ─────────────────────────────────────────── */
  .day-header{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 14px 16px;
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);border:1px solid var(--border);
    border-radius:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .day-header::before{content:"";position:absolute;inset:0;background:
    radial-gradient(600px 120px at 50% 0,rgba(231,193,92,.10),transparent 70%);pointer-events:none;}
  .day-date{font-size:13px;color:var(--muted);letter-spacing:.4px;}
  .day-net{font-size:44px;font-weight:800;line-height:1.05;margin:6px 0 4px;letter-spacing:-1px;}
  .day-sub{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap;justify-content:center;}
  .day-sub b{color:var(--text);font-weight:600;}

  /* ── Trip banner ────────────────────────────────────────── */
  #trip-banner{margin-top:12px;}
  .trip-banner{background:linear-gradient(180deg,rgba(231,193,92,.13),rgba(231,193,92,.04));
    border:1px solid var(--gold-dim);border-radius:14px;padding:12px 14px;text-align:center;}
  .trip-banner .tb-label{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;}
  .trip-banner .tb-pocket{font-size:31px;font-weight:800;letter-spacing:-.6px;line-height:1.1;margin:3px 0;}
  .trip-banner .tb-sub{font-size:11.5px;color:var(--muted);}
  .trip-banner .tb-sub b{color:var(--text);font-weight:600;}

  /* ── Fast select ────────────────────────────────────────── */
  /* Wrapping grid instead of a horizontal-scroll strip: every favorite is visible
     and tappable with no scrolling (which was awkward on both desktop and touch). */
  .fast-select{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;padding:14px 2px 4px;}
  .fast-chip{min-width:0;overflow:hidden;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:11px 13px;cursor:pointer;transition:transform .06s,border-color .15s;}
  .fast-chip:active{transform:scale(.96);}
  .fast-chip .fc-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fast-chip .fc-sub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fast-chip .fc-cat{font-size:15px;}
  .fast-chip.new{display:flex;align-items:center;justify-content:center;border-style:dashed;
    color:var(--gold);font-weight:700;font-size:14px;min-height:100%;}

  /* ── Session card ───────────────────────────────────────── */
  .session-card{margin-top:12px;}
  .session-card.active{border-color:var(--gold-dim);box-shadow:0 0 0 1px rgba(231,193,92,.15),var(--shadow);}
  .sc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .sc-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cat-chip{font-size:10px;text-transform:uppercase;letter-spacing:.7px;background:var(--chip);
    color:var(--muted);padding:3px 8px;border-radius:20px;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--win);display:inline-block;
    box-shadow:0 0 0 0 rgba(72,215,141,.6);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(72,215,141,.5);}70%{box-shadow:0 0 0 7px rgba(72,215,141,0);}100%{box-shadow:0 0 0 0 rgba(72,215,141,0);}}
  .sc-meta{font-size:12px;color:var(--muted);margin-top:5px;}
  .sc-money{display:flex;gap:10px;margin:13px 0 4px;}
  .money-block{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:9px 11px;}
  .money-block label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);}
  .money-block .val{font-size:21px;font-weight:800;margin-top:2px;}
  .sc-actions{display:flex;gap:8px;margin-top:12px;}
  .bonus-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  .bonus-row{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--panel2);
    border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
  .bonus-row .b-mult{font-weight:800;color:var(--gold);min-width:62px;}
  .bonus-row .b-amt{font-weight:600;}
  .bonus-row .b-x{margin-left:auto;color:var(--faint);cursor:pointer;font-size:16px;padding:0 4px;}
  .jackpot-badge{font-size:9px;font-weight:800;letter-spacing:.5px;background:var(--gold);color:#241c00;
    padding:2px 6px;border-radius:5px;text-transform:uppercase;}
  .sc-notes{font-size:12px;color:var(--muted);margin-top:10px;font-style:italic;}

  /* closed session rows */
  .sess-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);
    border-radius:13px;padding:11px 13px;margin-top:8px;cursor:pointer;transition:border-color .15s;}
  .sess-row:active{border-color:var(--gold-dim);}
  .sess-row .sr-main{flex:1;min-width:0;}
  .sess-row .sr-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sess-row .sr-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .sess-row .sr-net{font-size:17px;font-weight:800;text-align:right;white-space:nowrap;}

  /* Game rows (Games tab) with ▲▼ reorder controls — plain clicks, reliable on
     mobile + desktop inside the Activity iframe (drag/pointer events were not). */
  .game-row{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);
    border-radius:13px;padding:9px 11px;margin-top:8px;}
  .gr-main{flex:1;min-width:0;cursor:pointer;}
  .gr-main .sr-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gr-main .sr-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gr-ctrls{display:flex;gap:5px;flex:0 0 auto;}
  .gr-ctrls .icon-btn{width:30px;height:30px;font-size:12px;}
  .gr-ctrls .icon-btn:disabled{opacity:.28;}
  .reorder-hint{font-size:11px;color:var(--faint);margin:2px 2px 6px;}

  .empty{text-align:center;color:var(--faint);font-size:13px;padding:26px 10px;}

  /* ── Buttons ────────────────────────────────────────────── */
  button{font-family:inherit;cursor:pointer;border:none;}
  .btn{flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:700;background:var(--panel2);
    color:var(--text);border:1px solid var(--border);transition:transform .06s,filter .15s;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:linear-gradient(180deg,var(--gold) 0%,var(--gold-dim) 100%);color:#241c00;border-color:var(--gold-dim);}
  .btn.win{background:linear-gradient(180deg,#4fe0955c,#1f5c3f4a);border-color:#2e6f4d;color:var(--win);}
  .btn.danger{background:transparent;border-color:#5a2b2b;color:var(--loss);}
  .btn:disabled{opacity:.45;}
  .btn-lg{width:100%;padding:14px;font-size:15px;}
  .icon-btn{background:var(--chip);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;
    border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}

  /* ── Stat tiles ─────────────────────────────────────────── */
  .tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px;}
  .tile .t-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);}
  .tile .t-val{font-size:22px;font-weight:800;margin-top:5px;letter-spacing:-.5px;}
  .tile.span2{grid-column:span 2;}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:9px;}
  .bar-row .br-name{width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;border-radius:6px;}
  .bar-row .br-val{width:64px;text-align:right;font-weight:700;}
  .jp-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:10px 12px;margin-top:8px;}
  .jp-row .jp-amt{font-weight:800;color:var(--gold);}
  .jp-row .jp-main{flex:1;min-width:0;}
  .jp-row .jp-sub{font-size:11px;color:var(--muted);}

  /* ── Bottom sheet / modal ───────────────────────────────── */
  #sheet{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;
    background:rgba(0,0,0,.55);backdrop-filter:blur(3px);}
  #sheet.show{display:flex;}
  .sheet-panel{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);
    border-radius:20px 20px 0 0;padding:18px 16px calc(20px + var(--safe-bottom));max-height:92vh;overflow-y:auto;
    box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:slideUp .22s ease;}
  @keyframes slideUp{from{transform:translateY(40px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .sheet-grip{width:38px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 12px;}
  #sheet-title{font-size:18px;font-weight:800;margin-bottom:14px;}
  label.field{display:block;margin:12px 0 6px;font-size:12px;color:var(--muted);letter-spacing:.3px;}
  input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:16px;font-family:inherit;}
  input:focus,select,textarea:focus{outline:none;border-color:var(--gold-dim);}
  textarea{min-height:60px;resize:vertical;}
  .row2{display:flex;gap:10px;}.row2>*{flex:1;}
  .money-input{position:relative;}
  .money-input input{padding-left:26px;font-size:22px;font-weight:700;}
  .money-input .dollar{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;font-weight:700;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{flex:1 1 auto;min-width:88px;padding:9px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);
    color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap;}
  .seg button.sel{background:var(--gold);color:#241c00;border-color:var(--gold-dim);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;
    background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;}
  .toggle-row .tr-label{font-size:13px;}
  .switch{width:46px;height:27px;border-radius:20px;background:var(--border);position:relative;flex:0 0 auto;transition:background .2s;}
  .switch.on{background:var(--gold);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
    background:#fff;transition:transform .2s;}
  .switch.on::after{transform:translateX(19px);}
  .mult-preview{text-align:center;font-size:14px;color:var(--muted);margin-top:12px;}
  .mult-preview b{font-size:26px;color:var(--gold);display:block;font-weight:800;}
  .sheet-actions{display:flex;gap:10px;margin-top:20px;}

  /* ── Bottom nav ─────────────────────────────────────────── */
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;
    background:rgba(13,20,17,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);
    padding-bottom:var(--safe-bottom);}
  #nav .nav-inner{display:flex;width:100%;max-width:520px;}
  .nav-btn{flex:1;background:none;border:none;color:var(--faint);padding:9px 4px 8px;display:flex;
    flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;letter-spacing:.2px;}
  .nav-btn .ic{font-size:20px;line-height:1;filter:grayscale(1) opacity(.6);}
  .nav-btn.sel{color:var(--gold);}
  .nav-btn.sel .ic{filter:none;}

  #version-tag{position:fixed;bottom:calc(60px + var(--safe-bottom));right:8px;font-size:9px;color:var(--faint);
    font-family:monospace;z-index:40;pointer-events:none;}
  #mock-flag{position:fixed;top:0;left:0;right:0;background:var(--gold);color:#241c00;font-size:11px;
    font-weight:700;text-align:center;padding:3px;z-index:200;display:none;}
  #reload-pill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;right:8px;z-index:400;
    display:none;background:#5a1f26;border:1px solid var(--loss);color:#ffdfe3;font-size:12px;line-height:1.35;
    padding:10px 12px;border-radius:12px;text-align:center;box-shadow:var(--shadow);}
  #reload-pill.show{display:block;}
  #reload-pill b{display:block;font-size:13px;margin-bottom:1px;}
</style>
</head>
<body>

<div id="mock-flag">DEMO MODE — mock data, nothing is saved</div>
<div id="reload-pill"></div>
<div id="auth-status"><div id="auth-msg">Connecting to Discord…</div>
  <button id="auth-reconnect" class="btn primary" style="display:none;max-width:220px;margin:16px auto 0;">Reconnect</button>
  <div id="auth-debug"></div></div>
<div id="version-tag"></div>

<div id="app">
  <!-- ── TODAY ─────────────────────────────────────────────── -->
  <div id="screen-today" class="screen">
    <div class="day-header">
      <div class="day-date" id="day-date"></div>
      <div class="day-net" id="day-net">$0</div>
      <div class="day-sub" id="day-sub"></div>
    </div>
    <div id="trip-banner"></div>
    <div class="fast-select" id="fast-select"></div>
    <div id="active-sessions"></div>
    <div class="section-label">Today's sessions</div>
    <div id="today-sessions"></div>
  </div>

  <!-- ── HISTORY ───────────────────────────────────────────── -->
  <div id="screen-history" class="screen">
    <h1 style="font-size:22px;margin:6px 2px 4px;">History</h1>
    <div id="history-body"></div>
  </div>

  <!-- ── STATS ─────────────────────────────────────────────── -->
  <div id="screen-stats" class="screen">
    <h1 style="font-size:22px;margin:6px 2px 4px;">Lifetime Stats</h1>
    <div id="stats-body"></div>
  </div>

  <!-- ── BANKROLL ──────────────────────────────────────────── -->
  <div id="screen-bankroll" class="screen">
    <h1 style="font-size:22px;margin:6px 2px 4px;">Bankroll</h1>
    <div id="bankroll-body"></div>
  </div>

  <!-- ── GAMES ─────────────────────────────────────────────── -->
  <div id="screen-games" class="screen">
    <h1 style="font-size:22px;margin:6px 2px 10px;">Fast-Select Games</h1>
    <div id="games-body"></div>
    <button class="btn primary btn-lg" style="margin-top:14px;" data-add-game>+ Add a game</button>
  </div>
</div>

<div id="sheet"><div class="sheet-panel"><div class="sheet-grip"></div>
  <div id="sheet-title"></div><div id="sheet-body"></div>
</div></div>

<nav id="nav"><div class="nav-inner">
  <button class="nav-btn" data-tab="today"><span class="ic">🎰</span>Today</button>
  <button class="nav-btn" data-tab="history"><span class="ic">📜</span>History</button>
  <button class="nav-btn" data-tab="stats"><span class="ic">📊</span>Stats</button>
  <button class="nav-btn" data-tab="bankroll"><span class="ic">💰</span>Bankroll</button>
  <button class="nav-btn" data-tab="games"><span class="ic">🎯</span>Games</button>
</div></nav>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  Casino Session Tracker — Discord Activity frontend
//  Mirrors the raided-hex Activity stack: Discord-OAuth identity, Supabase-backed
//  Edge Functions (ct-auth / ct-whoami / ct-data / ct-write), session-token'd.
// ═══════════════════════════════════════════════════════════════════════════
const APP_VERSION='0.3.3';
document.getElementById('version-tag').textContent='v'+APP_VERSION;

// ── Crash reporter ─────────────────────────────────────────────────────────
// Mobile Discord kills/reloads backgrounded Activities aggressively; if anything
// throws on resume the app can look "crashed". This surfaces an uncaught error as a
// tap-to-reload bar (one tap recovers, and the text tells us exactly what died —
// invaluable since mobile has no usable devtools).
function reportErr(where,err){
  try{
    const msg=(err&&(err.message||(err.reason&&(err.reason.message||err.reason))||err.reason))||String(err||'');
    const pill=document.getElementById('reload-pill');
    if(!pill)return;
    pill.innerHTML='<b>⚠ Tap to reload</b>'+esc((where?where+': ':'')+String(msg)).slice(0,180)+' · v'+APP_VERSION;
    pill.classList.add('show');
  }catch(_){}
}
document.getElementById('reload-pill').addEventListener('click',()=>{try{location.reload();}catch(_){}});
window.addEventListener('error',e=>reportErr('error',(e&&(e.error||e))||''));
window.addEventListener('unhandledrejection',e=>reportErr('promise',e));

// ── Config ─────────────────────────────────────────────────────────────────
function isDiscordActivity(){return location.hostname.endsWith('.discordsays.com')||new URLSearchParams(location.search).has('frame_id');}
function withTimeout(p,ms,label){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(label+' timed out')),ms))]);}
const MOCK=new URLSearchParams(location.search).has('mock');

// Same Supabase project as raided-hex → same URL + publishable anon key.
const SUPABASE_URL=isDiscordActivity()?(location.origin+'/.proxy/supabase'):'https://uaoxvhihwiygrajicend.supabase.co';
const FUNCTIONS_URL=SUPABASE_URL+'/functions/v1';
const SUPABASE_ANON_KEY='sb_publishable_91Zn_uJ9anW46vAClx6-bQ__wLL4fXl';
// Tracker's own Discord application (separate from raided-hex's).
const DISCORD_CLIENT_ID='1540385140658933800';
const SESSION_KEY='casino_tracker_session';
const CACHE_KEY='casino_tracker_cache';

function genKey(){try{if(crypto.randomUUID)return crypto.randomUUID();}catch(_){}return 'k'+Date.now()+Math.random().toString(36).slice(2);}
// Persist last-known state so a cold boot (phone-sleep reload) can render instantly
// from cache instead of blocking on a network round-trip (the "crash" on resume).
function cacheState(){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({account,bootstrap:{
    today:state.today,games:state.games,active_trip:state.active_trip,
    active_trip_totals:state.active_trip_totals,sessions:state.sessions},ts:Date.now()}));}catch(_){}
}
function readCache(){try{const s=localStorage.getItem(CACHE_KEY);return s?JSON.parse(s):null;}catch(_){return null;}}

// ── App state ──────────────────────────────────────────────────────────────
let sessionToken=null;
let account=null;
let state={today:todayLocal(),games:[],active_trip:null,active_trip_totals:null,sessions:[]};
let currentTab='today';
let lastJackpots=[];

// ── Formatting helpers ─────────────────────────────────────────────────────
function todayLocal(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function num(v){return Number(v||0);}
function money(n){
  n=num(n);const neg=n<0;const abs=Math.abs(n);
  const s=abs%1===0?abs.toLocaleString('en-US'):abs.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?'-$':'$')+s;
}
function signMoney(n){n=num(n);return (n>0?'+':n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:2});}
function netClass(n){return num(n)>0?'win':num(n)<0?'loss':'';}
function fmtMult(m){return m==null?'—':(num(m).toFixed(num(m)>=100?0:1)+'×');}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function catIcon(c){return {slot:'🎰',video_poker:'🃏',bubble_craps:'🎲',table:'♠️',other:'✨'}[c]||'✨';}
function catLabel(c){return {slot:'Slot',video_poker:'Video Poker',bubble_craps:'Bubble Craps',table:'Table',other:'Other'}[c]||'Other';}
function isSlotty(c){return c==='slot'||c==='video_poker';} // has denom/base-bet + bonus tracker
function usesCents(c){return c==='slot'||c==='video_poker'||c==='bubble_craps';} // cents-first money entry + TITO ticket
function sessNet(s){return num(s.cash_out)-num(s.buy_in_total);}
function isOpen(s){return s.cash_out===null||s.cash_out===undefined;}
function prettyDate(iso){const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);
  return dt.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});}

// ── Cents-first money entry (POS/ATM style) ────────────────────────────────
// In cents mode the digits typed are read as cents: "1"→$0.01, "100"→$1.00,
// "12345"→$123.45. Used for slots / video poker / bubble craps money fields.
function centsReformat(inp){
  const digits=(inp.value.match(/\d/g)||[]).join('').replace(/^0+(?=\d)/,'').slice(0,12);
  inp.value=digits?(parseInt(digits,10)/100).toFixed(2):'';
}
function enableCents(inp){
  if(!inp||inp.dataset.cents)return;
  inp.dataset.cents='1';
  inp.setAttribute('inputmode','numeric');
  // A pre-filled dollar value (e.g. "2.5" on an edit) must be seeded to 2dp first,
  // or the digit-extractor would misread "2.5" as 25¢. Idempotent for already-2dp values.
  const seed=parseFloat(inp.value);
  if(inp.value.trim()!==''&&isFinite(seed))inp.value=seed.toFixed(2);
  inp._centsFmt=()=>centsReformat(inp);
  inp.addEventListener('input',inp._centsFmt);
}
function disableCents(inp){
  if(!inp||!inp.dataset.cents)return;
  delete inp.dataset.cents;
  inp.setAttribute('inputmode','decimal');
  if(inp._centsFmt){inp.removeEventListener('input',inp._centsFmt);inp._centsFmt=null;}
}
function applyCents(inp,on){on?enableCents(inp):disableCents(inp);}

// ── API layer (real Edge Functions, or the mock engine below) ───────────────
async function callFn(name,payload){
  const res=await fetch(FUNCTIONS_URL+'/'+name,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY,'apikey':SUPABASE_ANON_KEY},
    body:JSON.stringify(payload||{})});
  return res.json();
}
async function api(name,payload){
  if(MOCK)return mockApi(name,payload);
  return callFn(name,{...payload,session_token:sessionToken,today:state.today});
}
// Apply a bootstrap payload returned by any read/write to local state.
function applyBootstrap(b){if(!b)return;state={...state,...b};}

// ── Discord entry / resume ─────────────────────────────────────────────────
// callFn with a hard timeout so a stalled just-woke network never hangs the boot
// screen forever (the old flow had no timeout on authorize() or ct-auth).
function callFnT(name,payload,ms=12000){
  return withTimeout(callFn(name,payload),ms,name).catch(e=>({ok:false,message:(e&&e.message)||String(e)}));
}
function setAuthMsg(msg){document.getElementById('auth-status').classList.add('show');document.getElementById('auth-msg').textContent=msg;}
function showReconnect(msg){
  setAuthMsg(msg||'Couldn’t reach Discord. Tap to retry.');
  document.getElementById('app').classList.remove('show');
  document.getElementById('auth-reconnect').style.display='block';
}

// Entry orchestration: try the SAVED session first (fast, survives phone-sleep
// reloads), and only fall back to the full Discord OAuth handshake if that fails.
// This is what makes wake-up reliable — resuming no longer re-runs authorize().
async function enterDiscord(){
  document.getElementById('auth-reconnect').style.display='none';
  document.getElementById('auth-debug').textContent='';
  state.today=todayLocal();

  // 1) Instant paint from cache so a resume/reload never shows a blank or stuck
  //    "Connecting…" screen. We reconcile with the server in the background below.
  const cached=readCache();
  let painted=false;
  if(cached&&cached.account){
    try{
      account=cached.account;
      sessionToken=account.session_token||localStorage.getItem(SESSION_KEY);
      applyBootstrap(cached.bootstrap);
      document.getElementById('auth-status').classList.remove('show');
      document.getElementById('app').classList.add('show');
      setTab(currentTab||'today');
      painted=true;
    }catch(e){ // a stale/old-shape cache must never crash boot — fall through to connect
      console.error('cache render failed',e);
      account=null;sessionToken=null;try{localStorage.removeItem(CACHE_KEY);}catch(_){}
    }
  }
  if(!painted)setAuthMsg('Connecting…');

  // 2) Reconcile: validate/refresh the saved session in the background.
  if(await tryRestoreSession())return;               // booted/refreshed from server
  // ct-whoami didn't restore. If the token was cleared it was invalid/absent → OAuth.
  // If sessionToken is still set, it was just a network hiccup → keep the cached view.
  if(!sessionToken)await runDiscordEntry();
  if(!account)showReconnect();
}
document.getElementById('auth-reconnect').addEventListener('click',enterDiscord);

async function tryRestoreSession(){
  const token=localStorage.getItem(SESSION_KEY);if(!token)return false;
  sessionToken=token;
  const data=await callFnT('ct-whoami',{session_token:token,today:state.today});
  if(!data.ok||!data.account){
    if(data.message==='Invalid session.'||data.message==='Session expired.'){localStorage.removeItem(SESSION_KEY);sessionToken=null;}
    return false; // network error → keep token, OAuth fallback / reconnect will retry
  }
  boot(data.account,data.bootstrap);return true;
}

async function runDiscordEntry(){
  try{
    const {DiscordSDK}=window.DiscordSDKLib;
    const sdk=new DiscordSDK(DISCORD_CLIENT_ID);
    await withTimeout(sdk.ready(),20000,'Discord SDK ready()');
    let code;
    try{({code}=await withTimeout(sdk.commands.authorize({client_id:DISCORD_CLIENT_ID,response_type:'code',state:'',prompt:'none',scope:['identify']}),20000,'authorize'));}
    catch(e){({code}=await withTimeout(sdk.commands.authorize({client_id:DISCORD_CLIENT_ID,response_type:'code',state:'',prompt:'consent',scope:['identify']}),20000,'authorize'));}
    const data=await callFnT('ct-auth',{code,today:state.today});
    if(!data.ok||!data.account)throw new Error(data.message||'Sign-in failed.');
    localStorage.setItem(SESSION_KEY,data.account.session_token);
    boot(data.account,data.bootstrap);
  }catch(e){
    console.error('Discord entry failed:',e);
    document.getElementById('auth-debug').textContent='Debug: '+((e&&e.message)||e);
  }
}

function boot(acct,bootstrap){
  account=acct;sessionToken=acct.session_token||sessionToken;
  applyBootstrap(bootstrap);
  cacheState();
  document.getElementById('auth-reconnect').style.display='none';
  document.getElementById('auth-status').classList.remove('show');
  document.getElementById('app').classList.add('show');
  setTab(currentTab||'today');
}

// Resume handler: when the Activity becomes visible again after the phone slept, the
// iframe may have survived (stale data) or reloaded (cold boot handled by enterDiscord).
// If we still have a session, silently refresh; if it was lost, reconnect.
let resuming=false;
async function onResume(){
  if(MOCK||resuming||document.visibilityState!=='visible')return;
  resuming=true;
  try{
    state.today=todayLocal(); // date may have rolled to a new gambling day
    if(account&&sessionToken){
      const r=await callFnT('ct-data',{session_token:sessionToken,view:'today',today:state.today});
      if(r&&r.ok&&r.bootstrap){applyBootstrap(r.bootstrap);cacheState();
        if(currentTab==='today')renderToday();else if(currentTab==='bankroll')renderBankroll();}
      else if(r&&(r.message==='Invalid session.'||r.message==='Session expired.')){account=null;enterDiscord();}
    }else if(isDiscordActivity()){
      enterDiscord();
    }
  }finally{resuming=false;}
}
document.addEventListener('visibilitychange',onResume);
window.addEventListener('pageshow',e=>{if(e.persisted)onResume();});

function setTab(tab){
  currentTab=tab;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
  document.getElementById('screen-'+tab).classList.add('show');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('sel',b.dataset.tab===tab));
  window.scrollTo(0,0);
  if(tab==='today')renderToday();
  if(tab==='history')loadHistory();
  if(tab==='stats')loadStats();
  if(tab==='bankroll')renderBankroll();
  if(tab==='games')renderGames();
}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

// ── Today ──────────────────────────────────────────────────────────────────
function renderToday(){
  const sessions=state.sessions||[];
  const dayIn=sessions.reduce((s,x)=>s+num(x.buy_in_total),0);
  const dayOut=sessions.reduce((s,x)=>s+num(x.cash_out),0);
  const dayNet=dayOut-dayIn;
  document.getElementById('day-date').textContent=prettyDate(state.today);
  const netEl=document.getElementById('day-net');
  netEl.textContent=signMoney(dayNet);netEl.className='day-net '+netClass(dayNet);
  document.getElementById('day-sub').innerHTML=
    `<span>In <b>${money(dayIn)}</b></span><span>Out <b>${money(dayOut)}</b></span><span><b>${sessions.length}</b> session${sessions.length===1?'':'s'}</span>`;

  // Trip banner
  const tb=document.getElementById('trip-banner');
  if(state.active_trip&&state.active_trip_totals){
    const t=state.active_trip,tt=state.active_trip_totals;
    tb.innerHTML=`<div class="trip-banner">
      <div class="tb-label">💰 In pocket · ${esc(t.name)}</div>
      <div class="tb-pocket ${netClass(tt.net)}">${money(tt.remaining)}</div>
      <div class="tb-sub">Brought <b>${money(t.starting_bankroll)}</b>${t.casino?' · '+esc(t.casino):''} · net ${signMoney(tt.net)}</div>
    </div>`;
  }else tb.innerHTML='';

  // Fast select
  const fs=document.getElementById('fast-select');
  const games=(state.games||[]);
  fs.innerHTML=games.map(g=>`<div class="fast-chip" data-game="${g.id}">
      <div class="fc-cat">${catIcon(g.category)}</div>
      <div class="fc-name">${esc(g.name)}</div>
      <div class="fc-sub">${g.default_bet!=null?money(g.default_bet)+' bet':catLabel(g.category)}</div>
    </div>`).join('')+`<div class="fast-chip new" data-game="__new">+ New</div>`;
  fs.querySelectorAll('[data-game]').forEach(el=>el.addEventListener('click',()=>{
    if(el.dataset.game==='__new')openSessionSheet();
    else openSessionSheet(games.find(g=>g.id===el.dataset.game));
  }));

  // Active session cards
  const activeWrap=document.getElementById('active-sessions');
  const open=sessions.filter(isOpen);
  activeWrap.innerHTML=open.map(renderActiveCard).join('');
  bindActiveCards();

  // Closed sessions
  const closed=sessions.filter(s=>!isOpen(s));
  const list=document.getElementById('today-sessions');
  if(closed.length===0&&open.length===0){list.innerHTML='<div class="empty">No sessions yet today.<br>Tap a game above to start one.</div>';}
  else if(closed.length===0){list.innerHTML='<div class="empty">No closed sessions yet today.</div>';}
  else list.innerHTML=closed.map(sessRow).join('');
  list.querySelectorAll('[data-sess]').forEach(el=>el.addEventListener('click',()=>openEditSession(el.dataset.sess)));
}

function renderActiveCard(s){
  const net=sessNet(s);const bonuses=s.ct_bonuses||[];
  const meta=[s.denom!=null?money(s.denom)+' denom':null,s.bet_size!=null?money(s.bet_size)+' bet':null,s.casino].filter(Boolean).join(' · ');
  return `<div class="card session-card active" data-active="${s.id}">
    <div class="sc-head">
      <div class="sc-title"><span class="live-dot"></span>${esc(s.game_name)} <span class="cat-chip">${catLabel(s.category)}</span></div>
      <button class="icon-btn" data-edit="${s.id}">⋯</button>
    </div>
    ${meta?`<div class="sc-meta">${esc(meta)}</div>`:''}
    <div class="sc-money">
      <div class="money-block"><label>Bought in</label><div class="val">${money(s.buy_in_total)}</div></div>
      <div class="money-block"><label>Net so far</label><div class="val ${netClass(net)}">${signMoney(net)}</div></div>
    </div>
    <div class="sc-actions">
      <button class="btn" data-buyin="${s.id}">+ Buy-in</button>
      ${isSlotty(s.category)?`<button class="btn" data-bonus="${s.id}">✨ Bonus</button>`:''}
      <button class="btn primary" data-cashout="${s.id}">Cash out</button>
    </div>

function bonusRow(b){
  return `<div class="bonus-row">
    <span class="b-mult">${fmtMult(b.multiple)}</span>

function sessRow(s){
  const net=sessNet(s);const nb=(s.ct_bonuses||[]).length;

    <div class="sr-main">

function bindActiveCards(){
  const w=document.getElementById('active-sessions');
  w.querySelectorAll('[data-buyin]').forEach(b=>b.addEventListener('click',()=>openBuyinSheet(b.dataset.buyin)));
  w.querySelectorAll('[data-bonus]').forEach(b=>b.addEventListener('click',()=>openBonusSheet(b.dataset.bonus)));

  w.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEditSession(b.dataset.edit)));
  w.querySelectorAll('[data-delbonus]').forEach(b=>b.addEventListener('click',async()=>{
    const r=await api('ct-write',{action:'delete-bonus',id:b.dataset.delbonus});afterWrite(r);}));

function findSession(id){return (state.sessions||[]).find(s=>s.id===id);}

function openSheet(title,html,onMount){
  document.getElementById('sheet-title').textContent=title;

  document.getElementById('sheet').classList.add('show');
  if(onMount)onMount();

function closeSheet(){document.getElementById('sheet').classList.remove('show');}
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});

// Delegated clicks for buttons that live in HTML strings / static markup. Inline
// onclick="" handlers are blocked in the sandboxed Activity iframe, so everything
// routes through this one listener instead.
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close-sheet]'))closeSheet();
  else if(e.target.closest('[data-add-game]'))openGameSheet();
  else if(e.target.closest('[data-copy-jackpots]'))copyJackpots(lastJackpots);
});

// Discord Activities run in a sandboxed iframe where window.confirm()/alert() are
// silently blocked (they no-op), so we roll our own in-app confirm + toast.
function toast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:300;'+
    'background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:11px 16px;'+
    'border-radius:12px;font-size:13px;box-shadow:var(--shadow);max-width:88%;text-align:center;opacity:0;transition:opacity .2s;';
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.style.opacity='1');
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),260);},2600);
}
function confirmDialog(msg,{confirmLabel='Confirm',danger=false}={}){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:250;display:flex;align-items:center;justify-content:center;'+
      'background:rgba(0,0,0,.6);backdrop-filter:blur(3px);padding:24px;';
    ov.innerHTML='<div style="width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);'+
      'border-radius:18px;padding:20px;box-shadow:var(--shadow);">'+
      '<div style="font-size:15px;line-height:1.45;margin-bottom:18px;">'+esc(msg)+'</div>'+
      '<div style="display:flex;gap:10px;"><button class="btn" data-c="0">Cancel</button>'+
      '<button class="btn '+(danger?'danger':'primary')+'" data-c="1">'+esc(confirmLabel)+'</button></div></div>';
    const done=v=>{ov.remove();resolve(v);};
    ov.addEventListener('click',e=>{
      if(e.target===ov)return done(false);
      const b=e.target.closest('[data-c]');if(b)done(b.dataset.c==='1');
    });
    document.body.appendChild(ov);
  });
}

// After any mutation: apply returned bootstrap, re-render current tab.
function afterWrite(resp){
  if(!resp||!resp.ok){if(resp&&resp.message)toast(resp.message);return false;}
  applyBootstrap(resp.bootstrap);
  cacheState();
  closeSheet();
  if(currentTab==='today')renderToday();
  else if(currentTab==='bankroll')renderBankroll();
  else if(currentTab==='games')renderGames();
  else if(currentTab==='history')loadHistory();
  else if(currentTab==='stats')loadStats();
  return true;
}

      net.className='';net.classList.add(netClass(n));}
    amt.addEventListener('input',recalc);amt.focus();recalc();

    // TITO ticket scan: take/pick a photo, downscale it, read the cash value, prefill.
    const scanBtn=document.getElementById('co-scan');
    if(scanBtn){
      const fileInput=document.getElementById('co-file');
      const status=document.getElementById('co-scan-status');
      scanBtn.addEventListener('click',()=>fileInput.click());
      fileInput.addEventListener('change',async()=>{

        scanBtn.disabled=true;status.textContent='Reading ticket…';
        try{
          const {data,media_type}=await fileToScaledBase64(f);

    });
  });

// Downscale a chosen photo to a modest JPEG before upload — keeps the request small
// (a raw phone photo is several MB) and cheaper/faster to OCR. Returns base64 (no prefix).
function fileToScaledBase64(file,maxDim=1400,quality=0.72){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight;
      const scale=Math.min(1,maxDim/Math.max(w,h));
      w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(img.src);
      const dataUrl=c.toDataURL('image/jpeg',quality);
      resolve({data:dataUrl.split(',')[1],media_type:'image/jpeg'});
    };
    img.onerror=()=>{URL.revokeObjectURL(img.src);reject(new Error('Could not read image'));};
    img.src=URL.createObjectURL(file);
  });
}

// Move a favorite one slot up (dir=-1) or down (dir=1) and persist the new order via
// reorder-games. Optimistic local reorder + re-render so it feels instant.
async function moveGame(id,dir){
  const ids=(state.games||[]).map(g=>g.id);
  const i=ids.indexOf(id), j=i+dir;
  if(i<0||j<0||j>=ids.length)return;
  [ids[i],ids[j]]=[ids[j],ids[i]];
  state.games=ids.map(x=>(state.games||[]).find(g=>g.id===x)).filter(Boolean);
  renderGames();
  const resp=await api('ct-write',{action:'reorder-games',ids});
  if(resp&&resp.ok){applyBootstrap(resp.bootstrap);renderGames();}
}

function mockSeed(){
  const t=todayLocal();
  const dayAgo=(n)=>{const d=new Date();d.setDate(d.getDate()-n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
  let sid=0;const S=(o)=>({id:'s'+(++sid),account_id:'me',trip_id:'t1',game_id:null,notes:null,started_at:o.session_date+'T12:00:00',
    buyins:[],bonuses:[],denom:null,bet_size:null,casino:'Bellagio',cash_out:null,...o});
  const withBuyins=(s,amts)=>{s.buyins=amts.map((a,i)=>({id:s.id+'b'+i,session_id:s.id,amount:a}));s.buy_in_total=amts.reduce((x,y)=>x+y,0);return s;};
  const withBonus=(s,list)=>{s.bonuses=list.map((b,i)=>({id:s.id+'x'+i,session_id:s.id,amount:b.amount,base_bet:b.base_bet,multiple:b.base_bet?b.amount/b.base_bet:null,is_jackpot:b.amount>=1200,machine_name:s.game_name}));return s;};
  mockDB={
    account:{id:'me',discord_username:'You (demo)',session_token:'mock'},
    games:[
      {id:'g1',name:'Lightning Link',category:'slot',default_denom:1,default_bet:2.5,sort_order:0,archived:false},
      {id:'g2',name:'Buffalo Gold',category:'slot',default_denom:0.01,default_bet:1.5,sort_order:1,archived:false},
      {id:'g3',name:'Dragon Link',category:'slot',default_denom:0.05,default_bet:5,sort_order:2,archived:false},
      {id:'g4',name:'Blackjack',category:'table',default_denom:null,default_bet:null,sort_order:3,archived:false},
      {id:'g5',name:'Dbl Double Bonus',category:'video_poker',default_denom:0.25,default_bet:1.25,sort_order:4,archived:false},
    ],
    trips:[{id:'t1',name:'Vegas — August',casino:'Bellagio',starting_bankroll:1000,start_date:dayAgo(2),started_at:dayAgo(2)+'T18:00:00',ended_at:null}],
    sessions:[
      withBonus(withBuyins(S({game_name:'Lightning Link',category:'slot',denom:1,bet_size:2.5,session_date:t,cash_out:null}),[200,100]),[{amount:250,base_bet:2.5},{amount:80,base_bet:2.5}]),
      withBonus(withBuyins(S({game_name:'Buffalo Gold',category:'slot',denom:0.01,bet_size:1.5,session_date:t,cash_out:420}),[100]),[{amount:1500,base_bet:1.5}]),
      withBuyins(S({game_name:'Blackjack',category:'table',session_date:t,cash_out:60}),[100]),
      withBonus(withBuyins(S({game_name:'Dragon Link',category:'slot',denom:0.05,bet_size:5,session_date:dayAgo(1),cash_out:900}),[300]),[{amount:2000,base_bet:5}]),
      withBuyins(S({game_name:'Blackjack',category:'table',session_date:dayAgo(1),cash_out:80,casino:'Bellagio'}),[200]),
      withBonus(withBuyins(S({game_name:'Buffalo Gold',category:'slot',denom:0.01,bet_size:0.75,session_date:dayAgo(2),cash_out:40,casino:'Aria'}),[150]),[{amount:120,base_bet:0.75}]),
    ],
  };
}
function mockBootstrap(today){
  const games=mockDB.games.filter(g=>!g.archived).sort((a,b)=>a.sort_order-b.sort_order);
  const active_trip=mockDB.trips.find(t=>!t.ended_at)||null;
  const sessions=mockDB.sessions.filter(s=>s.session_date===today)
    .map(s=>({...s,ct_buyins:s.buyins,ct_bonuses:s.bonuses}));
  let active_trip_totals=null;
  if(active_trip){const st=active_trip.started_at||'';
    const ts=mockDB.sessions.filter(s=>!st||(s.started_at||'')>=st);
    const buyins=ts.reduce((x,s)=>x+num(s.buy_in_total),0),cashouts=ts.reduce((x,s)=>x+num(s.cash_out),0);
    active_trip_totals={buyins,cashouts,net:cashouts-buyins,remaining:num(active_trip.starting_bankroll)-buyins+cashouts};}
  return {today,games,active_trip,active_trip_totals,sessions};
}
function mockRecompute(s){s.buy_in_total=s.buyins.reduce((x,b)=>x+num(b.amount),0);}
function mockId(p){return p+Math.random().toString(36).slice(2,8);}
async function mockApi(name,payload){
  const today=payload.today||todayLocal();
  if(name==='ct-auth'||name==='ct-whoami')return {ok:true,account:mockDB.account,bootstrap:mockBootstrap(today)};
  if(name==='ct-data'){
    if(payload.view==='history')return {ok:true,sessions:mockDB.sessions.slice().sort((a,b)=>a.session_date<b.session_date?1:-1).map(s=>({...s,ct_buyins:s.buyins,ct_bonuses:s.bonuses}))};
    if(payload.view==='stats')return {ok:true,stats:mockStats()};
    return {ok:true,bootstrap:mockBootstrap(today)};
  }
  if(name==='ct-write'){mockWrite(payload);return {ok:true,bootstrap:mockBootstrap(today)};}
  if(name==='ct-scan-ticket'){await new Promise(r=>setTimeout(r,600));return {ok:true,amount:123.45,raw:'123.45'};}
  return {ok:false,message:'mock: unknown '+name};
}
function mockWrite(b){
  const find=id=>mockDB.sessions.find(s=>s.id===id);const a=b.action;
  if(a==='save-session'){
    if(b.id){const s=find(b.id);if(!s)return;
      ['game_name','category','casino'].forEach(k=>{if(k in b)s[k]=b[k];});
      if('denom' in b)s.denom=b.denom===''?null:num(b.denom);
      if('bet_size' in b)s.bet_size=b.bet_size===''?null:num(b.bet_size);
      if('notes' in b)s.notes=b.notes;
      if('cash_out' in b)s.cash_out=b.cash_out===''||b.cash_out==null?null:num(b.cash_out);
    }else{
      if(b.client_key&&mockDB.sessions.some(s=>s.client_key===b.client_key))return; // idempotent
      const s={id:mockId('s'),account_id:'me',client_key:b.client_key||null,trip_id:b.trip_id||null,game_id:b.game_id||null,game_name:b.game_name||'Untitled',
      category:b.category||'slot',casino:b.casino||null,denom:b.denom?num(b.denom):null,bet_size:b.bet_size?num(b.bet_size):null,
      notes:null,buy_in_total:0,cash_out:'cash_out' in b?(b.cash_out?num(b.cash_out):null):null,session_date:b.session_date||todayLocal(),
      started_at:new Date().toISOString(),buyins:[],bonuses:[]};
      if(b.buy_in){s.buyins.push({id:mockId('b'),session_id:s.id,amount:num(b.buy_in)});mockRecompute(s);}
      mockDB.sessions.push(s);}
  }else if(a==='delete-session'){mockDB.sessions=mockDB.sessions.filter(s=>s.id!==b.id);}
  else if(a==='add-buyin'){const s=find(b.session_id);if(s){s.buyins.push({id:mockId('b'),session_id:s.id,amount:num(b.amount)});mockRecompute(s);}}
  else if(a==='delete-buyin'){mockDB.sessions.forEach(s=>{const n=s.buyins.length;s.buyins=s.buyins.filter(x=>x.id!==b.id);if(s.buyins.length!==n)mockRecompute(s);});}
  else if(a==='add-bonus'){const s=find(b.session_id);if(s){const bb=b.base_bet?num(b.base_bet):num(s.bet_size);
    s.bonuses.push({id:mockId('x'),session_id:s.id,amount:num(b.amount),base_bet:bb||null,multiple:bb?num(b.amount)/bb:null,is_jackpot:!!b.is_jackpot,machine_name:b.machine_name||s.game_name});}}
  else if(a==='delete-bonus'){mockDB.sessions.forEach(s=>s.bonuses=s.bonuses.filter(x=>x.id!==b.id));}
  else if(a==='save-game'){if(b.id){const g=mockDB.games.find(x=>x.id===b.id);if(g)Object.assign(g,{name:b.name,category:b.category,default_denom:b.default_denom?num(b.default_denom):null,default_bet:b.default_bet?num(b.default_bet):null});}
    else mockDB.games.push({id:mockId('g'),name:b.name,category:b.category,default_denom:b.default_denom?num(b.default_denom):null,default_bet:b.default_bet?num(b.default_bet):null,sort_order:mockDB.games.length,archived:false});}
  else if(a==='delete-game'){const g=mockDB.games.find(x=>x.id===b.id);if(g)g.archived=true;}
  else if(a==='reorder-games'){(b.ids||[]).forEach((id,i)=>{const g=mockDB.games.find(x=>x.id===id);if(g)g.sort_order=i;});}
  else if(a==='save-trip'){if(b.id){const t=mockDB.trips.find(x=>x.id===b.id);if(t)Object.assign(t,{name:b.name,casino:b.casino,starting_bankroll:num(b.starting_bankroll)});}
    else mockDB.trips.push({id:mockId('t'),name:b.name,casino:b.casino,starting_bankroll:num(b.starting_bankroll),start_date:b.start_date||todayLocal(),started_at:new Date().toISOString(),ended_at:null});}
  else if(a==='close-trip'){const t=mockDB.trips.find(x=>x.id===b.id);if(t)t.ended_at=new Date().toISOString();}
}
function mockStats(){
  const sessions=mockDB.sessions;const closed=sessions.filter(s=>s.cash_out!=null);
  const net=s=>num(s.cash_out)-num(s.buy_in_total);
  const bonuses=sessions.flatMap(s=>s.bonuses.map(b=>({...b,ct_sessions:{game_name:s.game_name,casino:s.casino,session_date:s.session_date}})));
  const group=(key)=>{const m={};closed.forEach(s=>{const k=s[key]||(key==='casino'?'Unspecified':'Unknown');(m[k]=m[k]||{name:k,net:0,count:0,bought_in:0});m[k].net+=net(s);m[k].count++;m[k].bought_in+=num(s.buy_in_total);});return Object.values(m).sort((a,b)=>b.net-a.net);};
  const nets=closed.map(net);
  let biggest_bonus=null;bonuses.forEach(b=>{if(!biggest_bonus||num(b.multiple)>num(biggest_bonus.multiple))biggest_bonus=b;});
  return {lifetime_net:nets.reduce((a,b)=>a+b,0),total_bought_in:sessions.reduce((a,s)=>a+num(s.buy_in_total),0),
    total_cashed_out:closed.reduce((a,s)=>a+num(s.cash_out),0),session_count:closed.length,open_count:sessions.length-closed.length,
    biggest_win:nets.length?Math.max(...nets):0,biggest_loss:nets.length?Math.min(...nets):0,biggest_bonus,
    total_bonus_won:bonuses.reduce((a,b)=>a+num(b.amount),0),bonus_count:bonuses.length,
    by_game:group('game_name'),by_casino:group('casino'),jackpots:bonuses.filter(b=>b.is_jackpot).sort((a,b)=>num(b.amount)-num(a.amount))};
}
